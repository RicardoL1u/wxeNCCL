apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statuswatches.example.com
spec:
  group: example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                number:
                  type: integer
                  format: int32
                workers:
                  type: array
                  items:
                    type: string
                    format: uuid
  scope: Namespaced
  names:
    plural: statuswatches
    singular: statuswatch
    kind: StatusWatch
    shortNames:
    - sw
